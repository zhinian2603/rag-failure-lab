[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-failure-lab"
version = "0.1.0"
description = "A reproducible RAG failure triage and regression workbench"
requires-python = ">=3.10"
authors = [{name = "Kezhi Xu"}]
license = {text = "MIT"}

[project.scripts]
rag-failure-lab = "rag_failure_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_failure_lab = ["data/*.json"]
